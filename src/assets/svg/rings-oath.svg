<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <filter id="ringGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#d4af37" flood-opacity="0.8"/>
    </filter>
  </defs>
  <!-- Two intertwined Norse oath rings / torcs -->
  <g stroke="#d4af37" stroke-width="4.5" fill="none" stroke-linecap="round" filter="url(#ringGlow)">
    <!-- First ring (Naïara) -->
    <ellipse cx="40" cy="50" rx="26" ry="26" transform="rotate(-15 40 50)"/>
    <!-- Second ring (Guillermo) -->
    <ellipse cx="60" cy="50" rx="26" ry="26" transform="rotate(15 60 50)"/>
  </g>
  <!-- Torc terminals / dragon heads detail -->
  <circle cx="20" cy="40" r="3.5" fill="#f5e197"/>
  <circle cx="80" cy="40" r="3.5" fill="#f5e197"/>
  <!-- Central binding spark -->
  <polygon points="50,42 53,50 50,58 47,50" fill="#f5e197"/>
</svg>
