<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <filter id="hornGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#d4af37" flood-opacity="0.7"/>
    </filter>
  </defs>
  <g stroke="#d4af37" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round" filter="url(#hornGlow)">
    <!-- Horn curved body -->
    <path d="M 25,20 C 35,50 50,75 80,75 C 85,75 85,68 75,64 C 55,56 46,35 45,20 Z" fill="#1b222d" opacity="0.8"/>
    <path d="M 25,20 C 35,50 50,75 80,75 C 85,75 85,68 75,64 C 55,56 46,35 45,20"/>
    <!-- Horn rim (golden mouth) -->
    <ellipse cx="35" cy="20" rx="11" ry="4" stroke="#f5e197" stroke-width="3" fill="#352614"/>
    <!-- Decorative bands with Norse runes -->
    <path d="M 33,35 C 38,36 44,36 48,34" stroke="#f5e197" stroke-width="2"/>
    <path d="M 42,50 C 47,52 54,51 58,48" stroke="#f5e197" stroke-width="2"/>
    <!-- Tip metal finial -->
    <circle cx="80" cy="74" r="3" fill="#f5e197"/>
    <!-- Steam / Mead bubbles -->
    <circle cx="32" cy="12" r="1.5" fill="#f5e197" opacity="0.8"/>
    <circle cx="38" cy="10" r="1" fill="#f5e197" opacity="0.6"/>
  </g>
</svg>

