<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f5e197" stop-opacity="1"/>
      <stop offset="60%" stop-color="#c99738" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#7a5518" stop-opacity="0.4"/>
    </radialGradient>
    <filter id="runeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#d4af37" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Outer Runic Ring -->
  <circle cx="100" cy="100" r="92" fill="none" stroke="#c99738" stroke-width="1.8" stroke-dasharray="3 3" opacity="0.65"/>
  <circle cx="100" cy="100" r="86" fill="none" stroke="#d4af37" stroke-width="1.5" opacity="0.8"/>
  <circle cx="100" cy="100" r="76" fill="none" stroke="#947027" stroke-width="1" opacity="0.45"/>
  
  <!-- Central Hub -->
  <circle cx="100" cy="100" r="10" fill="none" stroke="#e6c66e" stroke-width="2"/>
  <circle cx="100" cy="100" r="4" fill="#d4af37"/>
  
  <!-- North Stave -->
  <g stroke="#d4af37" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#runeShadow)">
    <line x1="100" y1="90" x2="100" y2="22"/>
    <line x1="90" y1="36" x2="100" y2="28"/>
    <line x1="110" y1="36" x2="100" y2="28"/>
    <line x1="93" y1="52" x2="107" y2="52"/>
    <line x1="88" y1="62" x2="112" y2="62"/>
    <circle cx="100" cy="20" r="2.5" fill="#f5e197"/>
  </g>
  
  <!-- South Stave -->
  <g stroke="#d4af37" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#runeShadow)">
    <line x1="100" y1="110" x2="100" y2="178"/>
    <line x1="90" y1="164" x2="100" y2="172"/>
    <line x1="110" y1="164" x2="100" y2="172"/>
    <line x1="94" y1="146" x2="106" y2="146"/>
    <line x1="90" y1="134" x2="100" y2="124"/>
    <line x1="110" y1="134" x2="100" y2="124"/>
  </g>

  <!-- East Stave -->
  <g stroke="#d4af37" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#runeShadow)">
    <line x1="110" y1="100" x2="178" y2="100"/>
    <line x1="164" y1="90" x2="172" y2="100"/>
    <line x1="164" y1="110" x2="172" y2="100"/>
    <line x1="146" y1="94" x2="146" y2="106"/>
    <line x1="130" y1="92" x2="138" y2="108"/>
    <line x1="130" y1="108" x2="138" y2="92"/>
  </g>

  <!-- West Stave -->
  <g stroke="#d4af37" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#runeShadow)">
    <line x1="90" y1="100" x2="22" y2="100"/>
    <line x1="36" y1="90" x2="28" y2="100"/>
    <line x1="36" y1="110" x2="28" y2="100"/>
    <line x1="52" y1="92" x2="52" y2="108"/>
    <line x1="68" y1="90" x2="60" y2="100"/>
    <line x1="68" y1="110" x2="60" y2="100"/>
  </g>

  <!-- Diagonal NE Stave -->
  <g stroke="#d4af37" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <line x1="107" y1="93" x2="155" y2="45"/>
    <line x1="145" y1="45" x2="155" y2="45"/>
    <line x1="155" y1="55" x2="155" y2="45"/>
    <line x1="132" y1="62" x2="142" y2="72"/>
    <line x1="120" y1="74" x2="130" y2="84"/>
  </g>

  <!-- Diagonal NW Stave -->
  <g stroke="#d4af37" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <line x1="93" y1="93" x2="45" y2="45"/>
    <line x1="55" y1="45" x2="45" y2="45"/>
    <line x1="45" y1="55" x2="45" y2="45"/>
    <line x1="62" y1="62" x2="52" y2="72"/>
    <line x1="74" y1="74" x2="64" y2="84"/>
    <circle cx="43" cy="43" r="2" fill="#d4af37"/>
  </g>

  <!-- Diagonal SE Stave -->
  <g stroke="#d4af37" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <line x1="107" y1="107" x2="155" y2="155"/>
    <line x1="145" y1="155" x2="155" y2="155"/>
    <line x1="155" y1="145" x2="155" y2="155"/>
    <line x1="135" y1="135" x2="145" y2="125"/>
    <line x1="125" y1="145" x2="115" y2="135"/>
  </g>

  <!-- Diagonal SW Stave -->
  <g stroke="#d4af37" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <line x1="93" y1="107" x2="45" y2="155"/>
    <line x1="55" y1="155" x2="45" y2="155"/>
    <line x1="45" y1="145" x2="45" y2="155"/>
    <line x1="68" y1="132" x2="58" y2="142"/>
    <line x1="80" y1="120" x2="70" y2="130"/>
  </g>
</svg>

