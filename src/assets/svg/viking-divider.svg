<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 50" width="100%" height="50">
  <defs>
    <linearGradient id="divGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0"/>
      <stop offset="25%" stop-color="#d4af37" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#f5e197" stop-opacity="1"/>
      <stop offset="75%" stop-color="#d4af37" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0"/>
    </linearGradient>
    <filter id="divGlow" x="-10%" y="-30%" width="120%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#d4af37" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <!-- Left tapered line -->
  <path d="M 30,25 Q 150,22 240,25" fill="none" stroke="url(#divGrad)" stroke-width="1.5"/>
  <path d="M 60,25 Q 160,28 230,25" fill="none" stroke="url(#divGrad)" stroke-width="0.8" stroke-dasharray="4 4"/>
  
  <!-- Left knot flourish -->
  <g stroke="#d4af37" stroke-width="1.8" fill="none" opacity="0.85">
    <path d="M 210,25 C 220,15 235,15 245,25 C 255,35 270,35 280,25"/>
    <path d="M 210,25 C 220,35 235,35 245,25 C 255,15 270,15 280,25"/>
    <circle cx="210" cy="25" r="2.5" fill="#d4af37"/>
  </g>
  
  <!-- Center Runic Shield / Diamond -->
  <g filter="url(#divGlow)">
    <polygon points="300,10 315,25 300,40 285,25" fill="#12161f" stroke="#d4af37" stroke-width="2"/>
    <polygon points="300,16 309,25 300,34 291,25" fill="none" stroke="#f5e197" stroke-width="1"/>
    <!-- Gebo Rune (Gift / Union) in center: ᚷ -->
    <line x1="295" y1="20" x2="305" y2="30" stroke="#f5e197" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="305" y1="20" x2="295" y2="30" stroke="#f5e197" stroke-width="1.8" stroke-linecap="round"/>
  </g>
  
  <!-- Right knot flourish -->
  <g stroke="#d4af37" stroke-width="1.8" fill="none" opacity="0.85">
    <path d="M 320,25 C 330,15 345,15 355,25 C 365,35 380,35 390,25"/>
    <path d="M 320,25 C 330,35 345,35 355,25 C 365,15 380,15 390,25"/>
    <circle cx="390" cy="25" r="2.5" fill="#d4af37"/>
  </g>
  
  <!-- Right tapered line -->
  <path d="M 360,25 Q 450,22 570,25" fill="none" stroke="url(#divGrad)" stroke-width="1.5"/>
  <path d="M 370,25 Q 440,28 540,25" fill="none" stroke="url(#divGrad)" stroke-width="0.8" stroke-dasharray="4 4"/>
</svg>

